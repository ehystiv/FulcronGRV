    x: 1046
    y: 168
    livello: 1
    testo: Fortezza dove visse Eklitz von Sharr, il più grande Signore Vampiro che la storia ricordi, al confine con Ilshaka. Nel 3018 fu attaccata dall’esercito del Rorish, e la zona fu purificata da un’antica magia.
    wiki: /wiki/geopolitica/nord#ilshaka

  # ---------- Est ----------
  - id: citta-libere
    nome: Città libere del Deserto
    etichetta: 'Città libere|del Deserto'
    tipo: regione
    area: est
    x: 1010
    y: 452
    stimato: true
    testo: Grandi città-stato in stretti rapporti tra loro, in una regione desertica salvo le zone vicine a fiumi e oasi. Vi è forte il culto del dio sole Shamash. Le maggiori sono Nuova Theris, Partaros e Cyr.
    wiki: /wiki/geopolitica/est#le-città-libere-del-deserto
  - id: nuova-theris
    nome: Nuova Theris
    tipo: citta
    area: est
    x: 966
    y: 302
    livello: 1
    testo: La più settentrionale delle città libere, fondata sull’Amdinare dopo la Grande Guerra al posto di Theris, distrutta dai combattimenti. Dal 3013 la governa la Pentarchia, cinque principi con lo stesso potere.
    wiki: /wiki/geopolitica/est/nuova-theris
