    tipo: capitale
    area: nord
    x: 470
    y: 150
    stimato: true
    testo: Capitale di Iseldor, detta la Città del Peccato per i suoi numerosi bordelli. Il palazzo reale è pieno di pelli e teste di animali.
    wiki: /wiki/geopolitica/nord#iseldor
    lato: sinistra
  - id: shol
    nome: Shol
    tipo: capitale
    area: nord
    x: 584
    y: 77
    testo: Capitale di Erden. Accanto alle sue sorgenti calde sorge il più grande tempio di Samudra, dove i novizi compiono il Rituale di Purificazione immergendosi nelle acque gelide.
    wiki: /wiki/geopolitica/nord#erden
  - id: sassorosso
    nome: Sassorosso
    tipo: monti
    area: nord
    x: 520
    y: 198
    livello: 3
    testo: Catena montuosa poco a nord-ovest dell’antica foresta di Shandora.
    wiki: /wiki/geopolitica/nord#la-foresta-di-shandora
  - id: foresta-di-shandora
    nome: Foresta di Shandora
    tipo: foresta
    area: nord
    x: 474
    y: 262
    testo: Ciò che resta di una grande civiltà che regnò su quasi tutto il Nord fino a più di mille anni fa, devota al Sole e all’albero della vita. Una barriera di piante, forse magica, ne impedisce l’accesso.
    wiki: /wiki/geopolitica/nord#la-foresta-di-shandora
  - id: monte-lupo
    nome: Monte Lupo
    tipo: monti
    area: nord
    x: 372
    y: 268
    livello: 3
    testo: Un monte per lo più deserto, abitato da branchi di lupi e da una tribù di cacciatori guidata da uno sciamano, che i vicini chiamano semplicemente i Lupi.
    wiki: /wiki/geopolitica/nord#monte-lupo
