  - id: bontor
    nome: Bontor
    tipo: capitale
    area: nord
    x: 848
    y: 298
    stimato: true
    testo: Capitale di Foran, famosa per fabbri e armaioli capaci, si dice, di forgiare armi magiche. Nel 3013 cadde per mano del guardiano della foresta di Tyr; fu ripresa nel 3017.
    wiki: /wiki/geopolitica/nord#foran
  - id: ishar
    nome: Ishar
    tipo: borgo
    area: nord
    x: 905
    y: 254
    stimato: true
    testo: Cittadina del regno di Foran, attaccata nel 3017 da Ghevurà, il Rosso, della Mano della Setta, che vi morì. Valdyris vi ha aperto da poco una via commerciale.
    wiki: /wiki/la-setta
    lato: destra
  - id: foresta-di-tyr
    nome: Foresta di Tyr
    tipo: foresta
    area: nord
    x: 810
    y: 330
    testo: Una delle più estese foreste di Fulcron, al confine tra Nord ed Est, nata secondo la leggenda dal seme dell’albero sacro Bacab. Rifugio di creature magiche, elfi silvani e gnomi, protetta da un Guardiano.
    wiki: /wiki/geopolitica/nord#la-foresta-di-tyr
  - id: new-moon
