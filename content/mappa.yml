  # ---------- Sud ----------
  - id: limen
    nome: Limen
    tipo: citta
    area: sud
    x: 469
    y: 990
    livello: 1
    testo: Il grande porto del Sud, protetto da una barriera magica contro le scorrerie degli Elfi Oscuri. Il suo mercato accoglie merci da ogni angolo dell’Anello; i suoi cantieri navali usano il legname di Xyla.
    wiki: /wiki/geopolitica/sud/il-vecchio-sud#limen
  - id: xyla
    nome: Xyla
    tipo: citta
    area: sud
    x: 392
    y: 1010
    stimato: true
    testo: Al confine con le giungle dell’Ovest. Da qui i tagliaboschi strappano terre coltivabili alla foresta e riforniscono di legname i cantieri navali di Limen.
    wiki: /wiki/geopolitica/sud/il-vecchio-sud#xyla
  - id: antico-regno
    nome: L’Antico Regno
    tipo: regione
    area: sud
    x: 575
    y: 1052
    livello: 1
    testo: Il regno che ha resistito alla Breccia, da Stratos e Polyteles fino a Limen. Oggi lo governano due re, il guerriero Kyros e Arystarchos, già Rettore della Scuola Alchemica.
    wiki: /wiki/geopolitica/sud#un-nuovo-ordine-lantico-regno
  - id: stratos
    nome: Stratos
    tipo: citta
    area: sud
    x: 522
    y: 1107
    testo: La città in cui si addestra l’esercito del Sud, seconda per abitanti. Vi ha sede l’Accademia Militare, dove i maghi da battaglia imparano a sfruttare tutto il loro potere distruttivo.
    wiki: /wiki/geopolitica/sud/il-vecchio-sud#stratos
  - id: polyteles
    nome: Polyteles
    tipo: capitale
    area: sud
    x: 731
    y: 1067
    livello: 1
    testo: La capitale del Sud, a poche miglia dal Mare Interno. Ospita la più grande università dell’Anello, con la Scuola Alchemica e il Collegio della Magia. Distrutta nella Grande Guerra, è stata ricostruita ancora più alta.
    wiki: /wiki/geopolitica/sud/il-vecchio-sud#polyteles
  - id: terre-senza-legge
    nome: Terre senza Legge
    dipinto: Terre di Nessuno
    tipo: regione
    area: sud
    x: 676
    y: 1132
    ruota: -6
    testo: Le terre centrali del Sud, dopo la Breccia paradiso dei malviventi. Le dominano bande di sedicenti Re dei Briganti, come Raqqa-Ja e Toses.
    wiki: /wiki/geopolitica/sud#le-terre-senza-legge
  - id: tre-gemme
    nome: Le Tre Gemme del Sud
    tipo: regione
    area: sud
    x: 985
    y: 1105
    ruota: 32
    testo: Agyia, Ekpodon e Odis, fondate per controllare le frontiere orientali. Isolate dalle Terre senza Legge, oggi sono guidate dalle gilde mercantili, sempre più lontane da Polyteles.
    wiki: /wiki/geopolitica/sud#le-tre-gemme-del-sud
