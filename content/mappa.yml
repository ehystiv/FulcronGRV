  - id: partaros
    nome: Partaros
    tipo: capitale
    area: est
    x: 848
    y: 368
    livello: 1
    stimato: true
    testo: La Città Santa, la più estesa e fiorente delle città libere, tra i due bracci dell’Amdinare. Capitale dell’Impero del Sol Levante, sede dell’Ordine dei Guaritori; dal 3017 è una repubblica.
    wiki: /wiki/geopolitica/est/partaros
  - id: penthos
    nome: Penthos
    tipo: citta
    area: est
    x: 876
    y: 426
    testo: I «barbosi pentoshi» con i loro tappeti colorati si trovano fin nel mercato di Limen.
    wiki: /wiki/geopolitica/sud/il-vecchio-sud#limen
  - id: magione-peaful
    nome: Magione Peaful
    tipo: luogo
    area: est
    x: 936
    y: 232
    stimato: true
    testo: Antica magione al confine tra Nord ed Est. Nel 3017 vi si riunirono i potenti di Fulcron contrari alla Setta, e grazie ai poteri del luogo l’Occhio di Hava vi trovò la morte.
    wiki: /wiki/guerra-dell-occhio#la-magione-peaful-e-la-caduta-dellocchio-di-hava
  - id: cyr
    nome: Cyr
    tipo: citta
    area: est
    x: 1058
    y: 508
    livello: 1
