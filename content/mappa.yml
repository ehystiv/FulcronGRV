    tipo: deserto
    area: est
    x: 1190
    y: 505
    livello: 1
    ruota: 28
    testo: Il deserto sconfinato e arido che chiude l’Anello a est. Nessuno è mai riuscito a valicarlo.
    wiki: /wiki/geopolitica/est
  - id: jotai
