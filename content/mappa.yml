# Luoghi della mappa interattiva dell'Anello (/wiki/mappa). Si modificano qui senza toccare il codice.
#
# Ogni luogo ha:
#   id       nome breve senza spazi né accenti, usato nell'indirizzo (/wiki/mappa?luogo=partaros)
#   nome     come compare sulla mappa
#   tipo     capitale, citta, borgo, fortezza, luogo, evento   (un simbolo con il nome accanto)
#            macro, regione, regno, mare, isola, foresta, monti, pianura, lago, fiume, deserto, palude   (solo il nome, dipinto)
#   area     nord, est, sud, ovest o mare
#   x, y     posizione sulla mappa, da 0 a 1280 (0,0 è l'angolo in alto a sinistra)
#   livello  1 si vede sempre, 2 avvicinandosi, 3 solo da vicino (facoltativo, di base 2)
#   ruota    gradi di rotazione del nome (facoltativo, solo per i nomi dipinti)
#   etichetta il nome come va scritto sulla mappa, se diverso; | va a capo (facoltativo, solo per i nomi dipinti)
#   lato     sinistra per scrivere il nome a sinistra del simbolo (facoltativo)
#   stimato  true se la wiki ne parla ma la mappa originale non lo segna: la posizione è indicativa
#   dipinto  il nome scritto sulla mappa dipinta, se la wiki lo chiama diversamente (facoltativo)
#   testo    due righe per la scheda (facoltativo)
#   wiki     la pagina della wiki da aprire (facoltativo)

luoghi:
  # ---------- Le quattro terre e il mare ----------
  - id: nord
    nome: Nord
    tipo: macro
    area: nord
    x: 400
    y: 34
    livello: 1
    testo: Ispirato al medioevo europeo e dominato da re e regine di nobile stirpe. Comprende le Terre del Nord, il Qorish e il Rorish. Oltre i suoi confini si stende una landa perennemente gelata.
    wiki: /wiki/geopolitica/nord
  - id: est
    nome: Est
    tipo: macro
    area: est
    x: 1244
    y: 700
    livello: 1
    ruota: -90
    testo: Ispirato alle grandi civiltà asiatiche e nordafricane. Va dal fiume Amdinare e dalla Rocca Fantasma fino alle Tre Gemme del Sud; oltre, un deserto sconfinato che nessuno è mai riuscito a valicare.
    wiki: /wiki/geopolitica/est
  - id: sud
    nome: Sud
    tipo: macro
    area: sud
    x: 860
    y: 1262
    livello: 1
    testo: Famoso per i suoi maghi e alchimisti. Dopo il Giorno della Breccia, nel 3014, l’unico regno rimasto unito dopo la Grande Guerra si è diviso. Oltre la Muraglia, una palude sconfinata abitata dai Diaforos.
    wiki: /wiki/geopolitica/sud
  - id: ovest
    nome: Ovest
    tipo: macro
    area: ovest
    x: 168
    y: 1012
    livello: 1
    testo: La regione più selvaggia e ostile dell’Anello, coperta quasi per intero da fitte foreste e montagne impervie. A ovest la chiude un’altissima catena montuosa.
    wiki: /wiki/geopolitica/ovest
  - id: mare-interno
    nome: Mare Interno
    tipo: macro
    area: mare
    x: 664
    y: 354
    livello: 1
    testo: La più grande distesa d’acqua dell’Anello, al centro di Fulcron. Conta 65 isole abitate, cinque delle quali, le «isole portanti», sono le più estese. Si divide in nove mari più piccoli.
    wiki: /wiki/geopolitica/mare

  # ---------- Nord ----------
  - id: terre-del-nord
    nome: Terre del Nord
    tipo: regione
    area: nord
    x: 150
    y: 62
    livello: 1
    testo: Qui il gelo domina su tutto. Non ci sono insediamenti umani degni di questo nome, solo tribù nomadi di orchi e, sotto terra, il reame nanico di Casaroccia.
    wiki: /wiki/geopolitica/nord#terre-del-nord
  - id: qorish
    nome: Qorish
    tipo: regione
    area: nord
    x: 262
    y: 258
    livello: 1
    ruota: 22
    testo: Il territorio occidentale del Nord, dove i boschi prevalgono su tutto. Si divide in due regni, Ilvia e Ulia; molti insediamenti sono nati da carovane di mercanti.
    wiki: /wiki/geopolitica/nord#il-qorish
  - id: rorish
    nome: Rorish
    tipo: regione
    area: nord
    x: 620
    y: 192
    livello: 1
    ruota: 24
    testo: La regione più estesa e forse più civilizzata del Nord, divisa in sette regni governati autonomamente, i cui sovrani si riuniscono in una dieta comune per le decisioni importanti.
    wiki: /wiki/geopolitica/nord#il-rorish
  - id: ulia
    nome: Ulia
    tipo: regno
    area: nord
    x: 318
    y: 222
    testo: Regno di foreste a nord di Ilvia, diviso in quattro baronie (Galia, Rea, Galena e Antea). Durante la Guerra dell’Occhio si è arreso alla Setta; oggi è retto da Harrey Bowman.
    wiki: /wiki/geopolitica/nord#ulia
  - id: ilvia
    nome: Ilvia
    tipo: regno
    area: nord
    x: 290
    y: 336
    testo: "Regno del Qorish governato da re Gwyn Vinhaim con il concilio dei Sette Savi. È diviso in quattro baronie (Swanburg, Wintergate, Arrowdale e Fendergast). Stemma: una civetta delle nevi nera su sfondo blu."
    wiki: /wiki/geopolitica/nord#ilvia
  - id: iseldor
    nome: Iseldor
    tipo: regno
    area: nord
    x: 478
    y: 128
    testo: Regno di cacciatori a nord-ovest del Rorish, sul confine con le Terre del Nord. Chi vince la grande caccia che si tiene ogni cinque anni può diventare re; oggi regna la famiglia Alford.
    wiki: /wiki/geopolitica/nord#iseldor
  - id: erden
    nome: Erden
    tipo: regno
    area: nord
    x: 560
    y: 30
    testo: Regno famoso per le sue sorgenti, benedette da Samudra. Vi vivono molti elfi; regnano da decenni Aralion Flintwood e la moglie Ethel Answild.
    wiki: /wiki/geopolitica/nord#erden
  - id: shador
    nome: Shador
    tipo: regno
    area: nord
    x: 470
    y: 216
    testo: Regno quasi completamente immerso nella foresta di Shandora, diviso in sei contee. Trimold e Shamold, governate dalla stessa famiglia, sono dette le Contee Gemelle.
    wiki: /wiki/geopolitica/nord#shador
  - id: estar
    nome: Estar
    dipinto: Regno di Utelan
    tipo: regno
    area: nord
    x: 625
    y: 232
    testo: Il regno più centrale del Rorish, governato dalla regina Chloris Dorset e dal marito Leon Erophel Flintwood. I sovrani vengono scelti dal Regentium, tre anziani sacerdoti detti la Veggente, l’Errante e la Civetta.
    wiki: /wiki/geopolitica/nord#estar
  - id: lungacosta
    nome: Lungacosta
    tipo: regno
    area: nord
    x: 566
    y: 294
    testo: "Il regno costiero del Nord, con una possente flotta al servizio della regina Elaine Moonsharp. I commerci fioriscono. Stemma dei Moonsharp: una mezzaluna nera su sfondo celeste."
    wiki: /wiki/geopolitica/nord#lungacosta
  - id: ilshaka
    nome: Ilshaka
    tipo: regno
    area: nord
    x: 770
    y: 196
    ruota: 24
    testo: "Il regno più vasto del Rorish, famoso per la sua potenza militare e per re Nymbra Shoot, la Vecchia Tigre, decisivo per la vittoria del Nord nella Grande Guerra. Stemma: una tigre nera su sfondo bianco."
    wiki: /wiki/geopolitica/nord#ilshaka
  - id: foran
    nome: Foran
    tipo: regno
    area: nord
    x: 850
    y: 272
    testo: Piccolo regno a sud-est del Nord, al confine con la foresta di Tyr. Dopo anni sotto la protezione di Ilshaka, è tornato sul trono l’erede Sirius Duval.
    wiki: /wiki/geopolitica/nord#foran
  - id: casaroccia
    nome: Casaroccia
    tipo: capitale
    area: nord
    x: 262
    y: 104
    livello: 1
    testo: "Il reame nanico delle Terre del Nord, una gigantesca miniera che si estende per chilometri sotto terra. Il re ha una carica solo onoraria: decidono ministri eletti e il voto della comunità."
    wiki: /wiki/geopolitica/nord#casaroccia
  - id: babel
    nome: Babel
    tipo: borgo
    area: nord
    x: 175
    y: 108
    livello: 3
  - id: foresta-delle-rocce
    nome: Foresta delle Rocce
    tipo: foresta
    area: nord
    x: 163
    y: 168
  - id: foresta-cerulea
    nome: Foresta Cerulea
    tipo: foresta
    area: nord
    x: 92
    y: 262
    stimato: true
    testo: Fuori da ogni giurisdizione del Qorish. Prende il nome da un fiore celeste che, si dice, la ricopre per intero una volta ogni cento anni. Vi vivono migliaia di elfi; è interdetta agli stranieri.
    wiki: /wiki/geopolitica/nord#foresta-cerulea
  - id: mihifer
    nome: Mihifer
    tipo: capitale
    area: nord
    x: 275
    y: 172
    livello: 1
    testo: Capitale di Ulia, alle pendici del monte Iridel. Vi ha sede l’Accademia di Magia e Arti Elementali di Embergard, la più antica e prestigiosa scuola di magia di Fulcron. Nel 3017 fu assediata dalla Setta.
    wiki: /wiki/geopolitica/nord#accademia-di-magia-e-arti-elementali-di-embergard
  - id: monte-iridel
    nome: Monte Iridel
    dipinto: Monte Iridan
    tipo: monti
    area: nord
    x: 266
    y: 140
    livello: 3
    testo: Vulcano inattivo, preziosissima fonte di ossidiana. Ai suoi piedi sorge Mihifer.
    wiki: /wiki/geopolitica/nord#ulia
  - id: magnolia
    nome: Magnolia
    tipo: borgo
    area: nord
    x: 335
